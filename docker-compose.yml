version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: apex_gym_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: gym_management_db
      MYSQL_USER: apex_user
      MYSQL_PASSWORD: apex_secure_pass_2026
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  web:
    build: .
    container_name: apex_gym_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=apex_user
      - DB_PASSWORD=apex_secure_pass_2026
      - DB_NAME=gym_management_db
      - JWT_SECRET_KEY=apex_gym_jwt_secret_token_key_2026_super_secure
      - FLASK_PORT=5000
      - FLASK_ENV=production
      - DEBUG=False
    ports:
      - "5000:5000"

volumes:
  db_data:
